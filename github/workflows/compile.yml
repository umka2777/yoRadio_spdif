name: Build yoRadio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: New

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Install ESP32 Platform
      run: |
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.0.7

    - name: Install Dependencies
      run: |
        arduino-cli lib install "YAMLDuino"
        # Если проекту нужны другие библиотеки из менеджера, они прописываются здесь через arduino-cli lib install

    - name: Compile Sketch
      run: |
        arduino-cli compile --fqbn esp32:esp32:esp32s3 \
          --build-property "build.partitions=default_16MB" \
          --build-property "build.hwserial=0" \
          --output-dir ./build_output \
          ./yoRadio_spdif.ino

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yoRadio_Firmware
        path: ./build_output/yoRadio_spdif.ino.bin
